[workspace]
resolver = "2"
members = [
    "crates/mevdan-core",
    "crates/mevdan-storage",
    "crates/mevdan-config",
    "crates/mevdan-secrets",
    "crates/mevdan-provider",
    "crates/mevdan-models",
    "crates/mevdan-agent",
    "crates/mevdan-context",
    "crates/mevdan-tools",
    "crates/mevdan-permissions",
    "crates/mevdan-workgraph",
    "crates/mevdan-task",
    "crates/mevdan-verification",
    "crates/mevdan-checkpoint",
    "crates/mevdan-skills",
    "crates/mevdan-mcp",
    "crates/mevdan-lsp",
    "crates/mevdan-codeintel",
    "crates/mevdan-router",
    "crates/mevdan-worktree",
    "crates/mevdan-cli",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/lecodev-26/mevdan"
authors = ["lecodev-26 <echeparesmanuel36@gmail.com>"]

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
semver = { version = "1", features = ["serde"] }

# Regex for basic code parsing
regex = "1"

# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# Dev
tempfile = "3"
