[workspace]
resolver = "2"
members = [
    "crates/mevdan-core",
    "crates/mevdan-storage",
    "crates/mevdan-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/lecodev-26/mevdan"
authors = ["lecodev-26 <echeparesmanuel36@gmail.com>"]

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
semver = { version = "1", features = ["serde"] }

# Storage (sin bundled en Termux — usa el SQLite del sistema)
rusqlite = { version = "0.31", features = [] }

# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# Dev
tempfile = "3"
