# MEVDAN — clippy configuration
#
# Run with: cargo clippy --workspace --all-targets -- -D warnings

# Maximum cognitive complexity before warning
cognitive-complexity-threshold = 30

# Do not allow `unwrap()` in non-test code (via lint, configured in code)
# See: #![warn(clippy::unwrap_used)] in lib.rs

# Type complexity threshold
type-complexity-threshold = 250

# Too many arguments threshold
too-many-arguments-threshold = 8
