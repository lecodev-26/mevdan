[package]
name = "mevdan-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mevdan-core = { path = "../mevdan-core" }
mevdan-workgraph = { path = "../mevdan-workgraph" }
mevdan-checkpoint = { path = "../mevdan-checkpoint" }

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true

# Platform-specific rusqlite.
[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }

[target.'cfg(not(windows))'.dependencies]
rusqlite = { version = "0.31", features = [] }

[dev-dependencies]
tempfile.workspace = true
mevdan-task = { path = "../mevdan-task" }
mevdan-verification = { path = "../mevdan-verification" }
