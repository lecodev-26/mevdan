[package]
name = "mevdan-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mevdan-core = { path = "../mevdan-core" }

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true

# ─────────────────────────────────────────────
# Platform-specific rusqlite
# ─────────────────────────────────────────────
# On Windows there is no system SQLite, so we bundle it.
# On Linux / macOS / Android (Termux) we use the system SQLite
# for faster builds (no C compilation of SQLite).
#
# Note: we cannot use `rusqlite.workspace = true` here because we
# need different features per platform, and the virtual manifest
# (workspace root) does not allow [target.'cfg(...)'] sections.

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }

[target.'cfg(not(windows))'.dependencies]
rusqlite = { version = "0.31", features = [] }

[dev-dependencies]
tempfile.workspace = true
